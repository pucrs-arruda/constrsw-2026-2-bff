# Aplicar a partir da raiz do repositório base.
services:
  bff:
    environment:
      BFF_ORIGIN: ${BFF_ORIGIN:-http://localhost:8080}
      SESSION_COOKIE_NAME: ${OAUTH_SESSION_COOKIE_NAME:-closed_cras_session}
    depends_on: !override
      oauth: {condition: service_healthy}
      rooms: {condition: service_healthy}
      classes: {condition: service_healthy}
